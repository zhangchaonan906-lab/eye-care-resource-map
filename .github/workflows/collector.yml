name: Collector CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install public API dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Audit public API dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Run public API unit tests
        working-directory: apps/web
        run: npm test

      - name: Lint public API
        working-directory: apps/web
        run: npm run lint

      - name: Type check public API
        working-directory: apps/web
        run: npm run typecheck

      - name: Build public API
        working-directory: apps/web
        run: npm run build

      - name: Install collector and development tools
        run: python -m pip install --index-url https://pypi.org/simple -e "services/collector[dev]"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --local

      - name: Run unit tests
        working-directory: services/collector
        run: python -m pytest tests -m "not database and not etl_database and not geocode_database" -q

      - name: Lint
        working-directory: services/collector
        run: python -m ruff check src tests

      - name: Type check
        working-directory: services/collector
        run: python -m mypy src/eye_collector

      - name: Check whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Run PostGIS and collector database tests
        run: bash scripts/test-db.sh

  p13-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Build Web application
        working-directory: apps/web
        run: npm run build

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run P13 browser E2E
        working-directory: apps/web
        run: npm run test:e2e

      - name: Scan browser artifacts for secrets
        if: always()
        id: secret-scan
        working-directory: apps/web
        run: python scripts/scan-playwright-artifacts.py

      - name: Upload failure-only browser diagnostics
        if: failure() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p13-playwright-failure-diagnostics
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  p13-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Build Web application
        working-directory: apps/web
        run: npm run build

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run P13 axe and keyboard checks
        working-directory: apps/web
        run: npm run test:a11y

      - name: Scan browser artifacts for secrets
        if: always()
        id: secret-scan
        working-directory: apps/web
        run: python scripts/scan-playwright-artifacts.py

      - name: Upload failure-only accessibility diagnostics
        if: failure() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: p13-accessibility-failure-diagnostics
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
