[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-care-collector"
version = "0.1.0"
description = "Approved-source collection framework for the eye care resource map"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eye_collector = ["fixtures/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["database: requires the temporary PostGIS database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true
