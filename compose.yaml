name: eye-map

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: eye
      POSTGRES_PASSWORD: "${EYE_MAP_POSTGRES_PASSWORD:?Set EYE_MAP_POSTGRES_PASSWORD before starting the database}"
      POSTGRES_DB: eye
    ports:
      - "127.0.0.1:${EYE_MAP_DB_PORT:-55432}:5432"
    volumes:
      - eye_pgdata:/var/lib/postgresql/data
      - ./db:/workspace/db:ro
      - ./scripts:/workspace/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eye -d eye"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  eye_pgdata:
