name: eye-map

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: eye
      POSTGRES_PASSWORD: eye_local_only
      POSTGRES_DB: eye
    volumes:
      - eye_pgdata:/var/lib/postgresql/data
      - ./db:/workspace/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eye -d eye"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  eye_pgdata:
